<!DOCTYPE html>
<html lang="en" data-theme="nes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>SNAKE — 8-BIT</title>
<meta name="description" content="A retro 8-bit snake game with chiptune sound, pixel art and two arcade palettes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23141428'/><rect x='2' y='6' width='10' height='4' fill='%233ddc5a'/><rect x='11' y='5' width='3' height='4' fill='%237dff8a'/><rect x='12' y='5' width='1' height='1' fill='%23101020'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171b36;
    --bg2: #28305c;
    --panel: #262d53;
    --line: #4c5894;
    --line-dark: #101328;
    --text: #f6f8ff;
    --muted: #a6afd8;
    --accent: #ffdd55;
    --snake: #5cf07a;
    --font: "Press Start 2P", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  html[data-theme="cga"] {
    --bg: #0d0d26;
    --bg2: #1e1e50;
    --panel: #1e1e4c;
    --line: #47479e;
    --line-dark: #07071a;
    --text: #ecffff;
    --muted: #96accb;
    --accent: #ff6be0;
    --snake: #66ffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    color: var(--text);
    font-family: var(--font);
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
      radial-gradient(900px 600px at 50% -10%, var(--bg2) 0%, transparent 65%);
    background-size: 32px 32px, 32px 32px, 100% 100%;
    overflow: hidden;
    touch-action: manipulation;
  }

  .stage {
    width: min(94vw, 520px);
    width: min(94vw, 520px, max(260px, calc((100vh - 210px) * 4 / 3)));
    display: flex; flex-direction: column; gap: 14px;
  }
  @supports (height: 100dvh) {
    .stage { width: min(94vw, 520px, max(260px, calc((100dvh - 210px) * 4 / 3))); }
  }

  /* ---------- HUD ---------- */
  .hud { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; }
  .hud-item {
    background: var(--panel);
    border: 3px solid var(--line);
    box-shadow: 4px 4px 0 var(--line-dark);
    padding: 7px 9px 6px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .hud-item .label { font-size: 8px; color: var(--muted); letter-spacing: .08em; }
  .hud-item .value { font-size: 12px; letter-spacing: .06em; color: var(--text); }
  .hud-item .value.accent { color: var(--accent); }

  /* ---------- screen ---------- */
  .screen {
    position: relative;
    touch-action: none;
    border: 4px solid var(--line);
    box-shadow:
      0 0 0 4px var(--line-dark),
      10px 10px 0 var(--line-dark),
      0 0 42px rgba(126, 146, 255, .22);
    background: #000;
    transition: box-shadow .2s ease, border-color .2s ease;
    line-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  .scanlines {
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.16) 0px,
      rgba(0,0,0,.16) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: .32;
  }
  .vignette {
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.30) 100%);
  }

  .screen.levelup {
    animation: lvlflash .5s steps(3, end);
  }
  @keyframes lvlflash {
    0% {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--line-dark), 10px 10px 0 var(--line-dark), 0 0 34px var(--accent);
    }
    100% {
      border-color: var(--line);
    }
  }

  /* ---------- overlay ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    text-align: center;
    line-height: 1.6;
    background: rgba(4,4,10,.82);
    cursor: pointer;
    padding: 12px;
  }
  .overlay[data-kind="hidden"] { display: none; }
  .overlay-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .logo {
    font-size: clamp(20px, 7vw, 34px);
    letter-spacing: .1em;
    color: var(--text);
    text-shadow: 4px 4px 0 var(--line-dark), 0 0 18px rgba(255,255,255,.15);
  }
  .logo .hl { color: var(--snake); }
  .sub { font-size: 9px; color: var(--muted); letter-spacing: .14em; }
  .stats { font-size: 9px; color: var(--accent); letter-spacing: .1em; min-height: 12px; }
  .stats.new { animation: blink 900ms steps(2, end) infinite; }
  .cta {
    font-size: 10px;
    color: var(--text);
    padding: 9px 14px;
    border: 3px solid var(--line);
    box-shadow: 4px 4px 0 var(--line-dark);
    background: var(--panel);
    animation: blink 1.1s steps(2, end) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .25 } }

  /* ---------- controls ---------- */
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn {
    font-family: var(--font);
    font-size: 8px;
    letter-spacing: .06em;
    color: var(--text);
    background: var(--panel);
    border: 3px solid var(--line);
    box-shadow: 3px 3px 0 var(--line-dark);
    padding: 9px 10px;
    cursor: pointer;
    user-select: none;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  .actions { display: flex; gap: 8px; }

  .dpad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(2, 42px); gap: 5px; }
  .dbtn {
    font-family: var(--font); font-size: 12px; color: var(--text);
    background: var(--panel); border: 3px solid var(--line);
    box-shadow: 2px 2px 0 var(--line-dark);
    cursor: pointer; user-select: none; touch-action: none;
    display: grid; place-items: center;
  }
  .dbtn:active { background: var(--line); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  .hint { margin: 0; text-align: center; font-size: 7px; color: var(--muted); letter-spacing: .08em; line-height: 1.9; }

  @media (max-width: 430px) {
    .controls { align-items: flex-end; }
    .actions { flex-direction: column; }
    .btn { font-size: 7px; padding: 7px 8px; }
  }
  .overlay[data-kind="dead"] .logo { font-size: clamp(16px, 5.6vw, 26px); }

  body.mode-mouse .dpad { display: none; }
  body.mode-mouse canvas { cursor: crosshair; }

  .toast {
    position: absolute; left: 50%; top: 12px;
    transform: translateX(-50%);
    padding: 7px 10px;
    background: rgba(10,12,26,.88);
    border: 2px solid var(--line);
    color: var(--accent);
    font-size: 8px; letter-spacing: .1em;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .toast.show { opacity: 1; }
  @media (hover: hover) and (pointer: fine) {
    .dpad { display: none; }
  }
  @media (max-height: 640px) {
    .hint { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="hud" aria-label="Scoreboard">
      <div class="hud-item"><span class="label">SCORE</span><span class="value" id="score">000000</span></div>
      <div class="hud-item"><span class="label">BEST</span><span class="value" id="best">000000</span></div>
      <div class="hud-item"><span class="label">LVL</span><span class="value accent" id="level">01</span></div>
    </section>

    <section class="screen">
      <canvas id="game" width="320" height="240" aria-label="Snake game board"></canvas>
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div class="overlay" id="overlay" data-kind="title" role="button" tabindex="0">
        <div class="overlay-inner">
          <div class="logo" id="ovLogo">SNAKE</div>
          <div class="sub" id="ovSub">8-BIT ARCADE</div>
          <div class="stats" id="ovStats"></div>
          <div class="cta" id="ovCta">PRESS ENTER</div>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </section>

    <section class="controls">
      <div class="dpad" aria-label="Direction pad">
        <button class="dbtn up"    data-dir="up"    aria-label="Up">&#9650;</button>
        <button class="dbtn left"  data-dir="left"  aria-label="Left">&#9664;</button>
        <button class="dbtn down"  data-dir="down"  aria-label="Down">&#9660;</button>
        <button class="dbtn right" data-dir="right" aria-label="Right">&#9654;</button>
      </div>
      <div class="actions">
        <button class="btn" id="btnMode">MODE: KEYS</button>
        <button class="btn" id="btnSound" aria-pressed="false">SOUND ON</button>
        <button class="btn" id="btnTheme">THEME</button>
        <button class="btn" id="btnPause">PAUSE</button>
      </div>
    </section>

    <p class="hint">ARROWS / WASD MOVE &nbsp;·&nbsp; WALLS WRAP &nbsp;·&nbsp; SPACE PAUSE</p>
  </main>

<script>
'use strict';

/* ------------------------------------------------------------------ *
 *  constants & refs
 * ------------------------------------------------------------------ */
const GW = 20, GH = 15, CELL = 16;
const W = GW * CELL, H = GH * CELL;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const screenEl = document.querySelector('.screen');

const $score = document.getElementById('score');
const $best = document.getElementById('best');
const $level = document.getElementById('level');
const overlay = document.getElementById('overlay');
const ovLogo = document.getElementById('ovLogo');
const ovSub = document.getElementById('ovSub');
const ovStats = document.getElementById('ovStats');
const ovCta = document.getElementById('ovCta');
const btnMode = document.getElementById('btnMode');
const btnSound = document.getElementById('btnSound');
const btnTheme = document.getElementById('btnTheme');
const btnPause = document.getElementById('btnPause');
const toastEl = document.getElementById('toast');
const hintEl = document.querySelector('.hint');

/* ------------------------------------------------------------------ *
 *  palettes
 * ------------------------------------------------------------------ */
const THEMES = {
  nes: {
    board: '#232c56', boardAlt: '#283160',
    snakeDark: '#1a9448', snakeBody: '#4ee45e', snakeHead: '#8dffa0', snakeLight: '#dcffe3',
    food: '#ff6b7a', foodDark: '#a92b3c', foodShine: '#ffd6da', stem: '#4ee45e', leaf: '#b6ffc2',
    gold: '#ffdd55', goldDark: '#a87a00', goldShine: '#fff6c2',
    spark: '#ffffff'
  },
  cga: {
    board: '#0d0d34', boardAlt: '#11113e',
    snakeDark: '#009090', snakeBody: '#26e8e8', snakeHead: '#9dffff', snakeLight: '#e0ffff',
    food: '#ff5ede', foodDark: '#8f0070', foodShine: '#ffc4f4', stem: '#26e8e8', leaf: '#9dffff',
    gold: '#ffff66', goldDark: '#8a8a00', goldShine: '#ffffd0',
    spark: '#ffffff'
  }
};

/* ------------------------------------------------------------------ *
 *  state
 * ------------------------------------------------------------------ */
const STORE_KEY = 'snake8bit.best.v1';
const START_TICK = 160, MIN_TICK = 68;
const SEG = 6, TURN_RATE = 7.5;   // mouse-mode body spacing (px) and steering (rad/s)
const WRAP_WALLS = true;          // walls are open: you come out the opposite side

let theme = 'nes';
let mode = 'grid';               // 'grid' | 'mouse'
let body = [];                   // mouse-mode chain: head first
let angle = 0;
let targetX = W * 0.7, targetY = H / 2;
let pointerInside = false;
let mouseSpeed = 92;
let state = 'title';           // title | playing | paused | dead
let snake, dir, queue, food, particles, floats;
let score = 0, level = 1, eaten = 0, tickMs = START_TICK;
let grow = 0, acc = 0, last = 0, shake = 0, deathAt = 0, newBest = false;
let best = 0;
let muted = false;

try { best = Number(localStorage.getItem(STORE_KEY)) || 0; } catch (e) { best = 0; }

/* ------------------------------------------------------------------ *
 *  helpers
 * ------------------------------------------------------------------ */
const pad = (n, len) => String(Math.max(0, n | 0)).padStart(len, '0');
const randInt = n => (Math.random() * n) | 0;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function updateHud() {
  $score.textContent = pad(score, 6);
  $best.textContent = pad(best, 6);
  $level.textContent = pad(level, 2);
}

/* ------------------------------------------------------------------ *
 *  audio — tiny square-wave chiptune synth
 * ------------------------------------------------------------------ */
let ac = null;

function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
  }
  if (ac.state === 'suspended') ac.resume();
}

function beep(freq, dur, type = 'square', vol = 0.05, delay = 0, slideTo = 0) {
  if (muted || !ac) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ac.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

const sfx = {
  eat()    { beep(780, 0.07, 'square', 0.05); beep(1180, 0.09, 'square', 0.045, 0.06); },
  gold()   { [660, 880, 1100, 1400].forEach((f, i) => beep(f, 0.07, 'square', 0.045, i * 0.055)); },
  level()  { [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.09, 'triangle', 0.05, i * 0.07)); },
  die()    { beep(380, 0.55, 'sawtooth', 0.07, 0, 48); beep(190, 0.5, 'square', 0.05, 0.02, 30); },
  pause()  { beep(440, 0.06, 'square', 0.04); },
  start()  { beep(523, 0.06, 'square', 0.04); beep(784, 0.08, 'square', 0.04, 0.06); }
};

/* ------------------------------------------------------------------ *
 *  overlay screens
 * ------------------------------------------------------------------ */
const coarse = window.matchMedia('(pointer: coarse)').matches;

function setOverlay(kind) {
  overlay.dataset.kind = kind;
  if (kind === 'title') {
    ovLogo.innerHTML = 'SN<span class="hl">A</span>KE';
    ovSub.textContent = '8-BIT ARCADE';
    ovStats.textContent = 'BEST ' + pad(best, 6);
    ovStats.classList.remove('new');
    ovCta.textContent = coarse ? 'TAP TO START' : 'PRESS ENTER';
  } else if (kind === 'paused') {
    ovLogo.textContent = 'PAUSED';
    ovSub.textContent = 'TAKE A BREATHER';
    ovStats.textContent = 'SCORE ' + pad(score, 6);
    ovStats.classList.remove('new');
    ovCta.textContent = coarse ? 'TAP TO RESUME' : 'PRESS SPACE';
  } else if (kind === 'dead') {
    ovLogo.textContent = 'GAME OVER';
    ovSub.textContent = 'SCORE ' + pad(score, 6);
    ovStats.textContent = newBest ? 'NEW HIGH SCORE!' : 'BEST ' + pad(best, 6);
    ovStats.classList.toggle('new', newBest);
    ovCta.textContent = coarse ? 'TAP TO RETRY' : 'PRESS ENTER';
  }
}

function hideOverlay() {
  overlay.dataset.kind = 'hidden';
}

/* ------------------------------------------------------------------ *
 *  core game
 * ------------------------------------------------------------------ */
const pal = () => THEMES[theme];

function resetGame() {
  snake = [{ x: 10, y: 7 }, { x: 9, y: 7 }, { x: 8, y: 7 }];
  dir = { x: 1, y: 0 };
  queue = [];
  angle = 0;
  targetX = W * 0.7; targetY = H / 2;
  mouseSpeed = 92;
  if (mode === 'mouse') buildBodyFromGrid(); else body = [];
  particles = [];
  floats = [];
  grow = 0; acc = 0;
  score = 0; level = 1; eaten = 0; tickMs = START_TICK;
  shake = 0; newBest = false;
  food = spawnFood('apple');
  updateHud();
}

function buildBodyFromGrid() {
  const pts = snake.map(c => ({ x: c.x * CELL + CELL / 2, y: c.y * CELL + CELL / 2 }));
  body = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.round(dist / SEG));
    for (let j = 0; j < n; j++) {
      body.push({ x: a.x + (b.x - a.x) * (j / n), y: a.y + (b.y - a.y) * (j / n) });
    }
  }
  body.push({ ...pts[pts.length - 1] });
  angle = Math.atan2(dir.y, dir.x);
  targetX = body[0].x + Math.cos(angle) * 48;
  targetY = body[0].y + Math.sin(angle) * 48;
}

function buildGridFromMouse() {
  const raw = [];
  for (const p of body) {
    const cx = clamp(Math.floor(p.x / CELL), 0, GW - 1);
    const cy = clamp(Math.floor(p.y / CELL), 0, GH - 1);
    const last = raw[raw.length - 1];
    if (!last || last.x !== cx || last.y !== cy) raw.push({ x: cx, y: cy });
  }
  const cells = [];
  for (const c of raw) {
    if (!cells.length) { cells.push(c); continue; }
    let x = cells[cells.length - 1].x, y = cells[cells.length - 1].y;
    while (x !== c.x || y !== c.y) {
      if (x !== c.x) x += Math.sign(c.x - x);
      else y += Math.sign(c.y - y);
      cells.push({ x, y });
    }
  }
  snake = cells.length ? cells : [{ x: 10, y: 7 }, { x: 9, y: 7 }, { x: 8, y: 7 }];

  const head = snake[0];
  const options = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  let best = null, bestRoom = -1;
  for (const d of options) {
    let x = head.x, y = head.y, room = 0;
    while (true) {
      x += d.x; y += d.y;
      if (x < 0 || y < 0 || x >= GW || y >= GH) break;
      if (snake.some((s, i) => i > 0 && s.x === x && s.y === y)) break;
      room++;
    }
    if (room > bestRoom) { bestRoom = room; best = d; }
  }
  dir = best || { x: 1, y: 0 };
  queue = [];
  grow = 0;
}

function freeCells() {
  const taken = new Set();
  const addCell = (x, y) => {
    if (x >= 0 && y >= 0 && x < GW && y < GH) taken.add(y * GW + x);
  };
  if (mode === 'grid') {
    for (const s of snake) addCell(s.x, s.y);
  } else {
    for (const b of body) addCell(Math.floor(b.x / CELL), Math.floor(b.y / CELL));
  }
  if (food) addCell(food.x, food.y);
  const cells = [];
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      if (!taken.has(y * GW + x)) cells.push({ x, y });
    }
  }
  return cells;
}

function spawnFood(kind) {
  const cells = freeCells();
  if (!cells.length) return null;
  const c = cells[randInt(cells.length)];
  const type = kind || (eaten > 0 && Math.random() < 0.16 ? 'golden' : 'apple');
  return { x: c.x, y: c.y, type, born: performance.now() };
}

function step() {
  if (queue.length) dir = queue.shift();

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= GW || head.y >= GH) {
    if (!WRAP_WALLS) { die(head); return; }
    head.x = (head.x + GW) % GW;
    head.y = (head.y + GH) % GH;
  }

  const checkLen = grow > 0 ? snake.length : snake.length - 1;
  for (let i = 0; i < checkLen; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) {
      die(head);
      return;
    }
  }

  snake.unshift(head);
  if (grow > 0) grow--; else snake.pop();

  if (food && head.x === food.x && head.y === food.y) eat();
}

function updateMouse(dt) {
  if (!body.length) return;
  const head = body[0];

  const dx = targetX - head.x, dy = targetY - head.y;
  if (dx * dx + dy * dy > 36) {
    const want = Math.atan2(dy, dx);
    const diff = ((want - angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    const maxTurn = TURN_RATE * dt / 1000;
    angle += clamp(diff, -maxTurn, maxTurn);
  }

  const stepLen = mouseSpeed * dt / 1000;
  head.x += Math.cos(angle) * stepLen;
  head.y += Math.sin(angle) * stepLen;

  if (WRAP_WALLS) {
    if (head.x < 0) head.x += W; else if (head.x >= W) head.x -= W;
    if (head.y < 0) head.y += H; else if (head.y >= H) head.y -= H;
  }

  for (let i = 1; i < body.length; i++) {
    const prev = body[i - 1], cur = body[i];
    let vx = cur.x - prev.x, vy = cur.y - prev.y;
    if (WRAP_WALLS) {
      /* measure across the seam, so the tail follows the head through the wall */
      if (vx > W / 2) vx -= W; else if (vx < -W / 2) vx += W;
      if (vy > H / 2) vy -= H; else if (vy < -H / 2) vy += H;
    }
    let d = Math.hypot(vx, vy);
    if (d < 0.0001) { vx = -Math.cos(angle); vy = -Math.sin(angle); d = 1; }
    if (d > SEG) {
      cur.x = prev.x + (vx / d) * SEG;
      cur.y = prev.y + (vy / d) * SEG;
      if (WRAP_WALLS) {
        if (cur.x < 0) cur.x += W; else if (cur.x >= W) cur.x -= W;
        if (cur.y < 0) cur.y += H; else if (cur.y >= H) cur.y -= H;
      }
    }
  }

  if (!WRAP_WALLS && (head.x < 5 || head.y < 5 || head.x > W - 5 || head.y > H - 5)) {
    die(head);
    return;
  }

  for (let i = 6; i < body.length; i++) {
    const ddx = body[i].x - head.x, ddy = body[i].y - head.y;
    if (ddx * ddx + ddy * ddy < 64) { die(head); return; }
  }

  if (food) {
    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    const fdx = fx - head.x, fdy = fy - head.y;
    if (fdx * fdx + fdy * fdy < 121) eat();
  }
}

function eat() {
  const golden = food.type === 'golden';
  const cx = food.x * CELL + CELL / 2;
  const cy = food.y * CELL + CELL / 2;

  score += golden ? 50 : 10;
  eaten++;
  if (mode === 'mouse') {
    const add = golden ? 5 : 2;
    const tail = body[body.length - 1] || { x: W / 2, y: H / 2 };
    for (let i = 1; i <= add; i++) {
      body.push({ x: tail.x - Math.cos(angle) * SEG * i, y: tail.y - Math.sin(angle) * SEG * i });
    }
  } else {
    grow += golden ? 3 : 1;
  }

  floats.push({
    x: cx, y: cy - 4,
    text: '+' + (golden ? 50 : 10),
    life: 680, max: 680,
    color: golden ? pal().gold : '#eafff0'
  });

  burst(cx, cy, golden ? pal().gold : pal().food, golden ? 22 : 12, golden ? 1.3 : 1);
  if (golden) sfx.gold(); else sfx.eat();

  if (eaten % 5 === 0) {
    level++;
    tickMs = Math.max(MIN_TICK, START_TICK - (level - 1) * 11);
    mouseSpeed = Math.min(190, 92 + (level - 1) * 12);
    sfx.level();
    screenEl.classList.remove('levelup');
    void screenEl.offsetWidth;
    screenEl.classList.add('levelup');
    setTimeout(() => screenEl.classList.remove('levelup'), 560);
  }

  food = spawnFood();

  if (score > best) { best = score; newBest = true; }
  updateHud();
}

function die(head) {
  state = 'dead';
  deathAt = performance.now();
  shake = 7;

  const hx = mode === 'mouse'
    ? (head ? head.x : body[0].x)
    : (head ? head.x : snake[0].x) * CELL + CELL / 2;
  const hy = mode === 'mouse'
    ? (head ? head.y : body[0].y)
    : (head ? head.y : snake[0].y) * CELL + CELL / 2;
  burst(hx, hy, pal().snakeHead, 26, 1.6);
  burst(hx, hy, '#ffffff', 10, 1.1);
  sfx.die();

  if (best < score) { best = score; newBest = true; }
  try { localStorage.setItem(STORE_KEY, String(best)); } catch (e) {}
  updateHud();

  setTimeout(() => { if (state === 'dead') setOverlay('dead'); }, 420);
  if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
}

function startGame() {
  ensureAudio();
  resetGame();
  hideOverlay();
  state = 'playing';
  last = performance.now();
  btnPause.textContent = 'PAUSE';
  sfx.start();
}

function togglePause() {
  if (state === 'title' || state === 'dead') { startGame(); return; }
  if (state === 'playing') {
    state = 'paused';
    setOverlay('paused');
    btnPause.textContent = 'RESUME';
    sfx.pause();
  } else if (state === 'paused') {
    state = 'playing';
    hideOverlay();
    btnPause.textContent = 'PAUSE';
    last = performance.now();
    sfx.pause();
  }
}

/* ------------------------------------------------------------------ *
 *  particles
 * ------------------------------------------------------------------ */
function burst(cx, cy, color, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (0.03 + Math.random() * 0.11) * power;
    const life = 350 + Math.random() * 350;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 0.03,
      life, max: life,
      color,
      size: Math.random() < 0.55 ? 2 : 3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.00045 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.restore();
}

/* tiny 3x5 pixel font for floating score popups */
const GLYPHS = {
  '0': ['111', '101', '101', '101', '111'],
  '1': ['010', '110', '010', '010', '111'],
  '2': ['111', '001', '111', '100', '111'],
  '3': ['111', '001', '111', '001', '111'],
  '4': ['101', '101', '111', '001', '001'],
  '5': ['111', '100', '111', '001', '111'],
  '6': ['111', '100', '111', '101', '111'],
  '7': ['111', '001', '010', '010', '010'],
  '8': ['111', '101', '111', '101', '111'],
  '9': ['111', '101', '111', '001', '111'],
  '+': ['000', '010', '111', '010', '000']
};

function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 0.018 * dt;
    f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
}

function drawFloats() {
  ctx.save();
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.fillStyle = f.color;
    const s = 2, gw = 3 * s + 2;
    let x = Math.round(f.x - (f.text.length * gw - 2) / 2);
    const y = Math.round(f.y);
    for (const ch of f.text) {
      const g = GLYPHS[ch];
      if (g) {
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 3; c++) {
            if (g[r][c] === '1') ctx.fillRect(x + c * s, y + r * s, s, s);
          }
        }
      }
      x += gw;
    }
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ *
 *  sprites
 * ------------------------------------------------------------------ */
function drawApple(p, ox, oy) {
  ctx.fillStyle = p.foodDark;
  ctx.fillRect(ox + 4, oy + 3, 8, 10);
  ctx.fillRect(ox + 3, oy + 5, 10, 6);

  ctx.fillStyle = p.food;
  ctx.fillRect(ox + 5, oy + 4, 6, 8);
  ctx.fillRect(ox + 4, oy + 6, 8, 4);

  ctx.fillStyle = p.foodShine;
  ctx.fillRect(ox + 5, oy + 5, 2, 2);
  ctx.fillRect(ox + 6, oy + 4, 2, 1);

  ctx.fillStyle = p.stem;
  ctx.fillRect(ox + 8, oy + 1, 2, 2);
  ctx.fillStyle = p.leaf;
  ctx.fillRect(ox + 10, oy + 2, 3, 2);
}

function drawGolden(p, ox, oy, t) {
  const remain = 8000 - (performance.now() - food.born);
  if (remain < 2200 && Math.floor(performance.now() / 120) % 2 === 0) return;

  ctx.fillStyle = p.goldDark;
  ctx.fillRect(ox + 6, oy + 2, 4, 2);
  ctx.fillRect(ox + 4, oy + 4, 8, 2);
  ctx.fillRect(ox + 2, oy + 6, 12, 4);
  ctx.fillRect(ox + 4, oy + 10, 8, 2);
  ctx.fillRect(ox + 6, oy + 12, 4, 2);

  ctx.fillStyle = p.gold;
  ctx.fillRect(ox + 7, oy + 3, 2, 2);
  ctx.fillRect(ox + 5, oy + 5, 6, 2);
  ctx.fillRect(ox + 3, oy + 7, 10, 2);
  ctx.fillRect(ox + 5, oy + 9, 6, 2);
  ctx.fillRect(ox + 7, oy + 11, 2, 2);

  ctx.fillStyle = p.goldShine;
  ctx.fillRect(ox + 6, oy + 6, 2, 2);
  ctx.fillRect(ox + 8, oy + 6, 1, 1);

  const a = t / 320;
  ctx.fillStyle = p.spark;
  ctx.fillRect(Math.round(ox + 8 + Math.cos(a) * 12), Math.round(oy + 8 + Math.sin(a * 1.3) * 10), 2, 2);
  ctx.fillRect(Math.round(ox + 8 + Math.cos(a + 2.6) * 11), Math.round(oy + 8 + Math.sin(a * 1.3 + 2.6) * 9), 1, 1);
}

function drawFood(p, t) {
  if (!food) return;
  const ox = food.x * CELL, oy = food.y * CELL;
  if (food.type === 'golden') drawGolden(p, ox, oy, t);
  else drawApple(p, ox, oy);
}

function drawEyes(p, ox, oy, flash) {
  const cx = ox + CELL / 2, cy = oy + CELL / 2;
  const px = -dir.y, py = dir.x;
  const eyes = [
    { x: cx + dir.x * 2.5 + px * 4, y: cy + dir.y * 2.5 + py * 4 },
    { x: cx + dir.x * 2.5 - px * 4, y: cy + dir.y * 2.5 - py * 4 }
  ];
  for (const e of eyes) {
    const ex = Math.round(e.x), ey = Math.round(e.y);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ex - 2, ey - 2, 4, 4);
    if (!flash) {
      ctx.fillStyle = '#101020';
      ctx.fillRect(ex - 1 + dir.x, ey - 1 + dir.y, 2, 2);
    }
  }
}

function drawSnake(p, t) {
  if (!snake || !snake.length) return;
  const flash = state === 'dead' && performance.now() - deathAt < 170;

  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const ox = s.x * CELL, oy = s.y * CELL;
    const isHead = i === 0;

    ctx.fillStyle = flash ? '#ffffff' : (isHead ? p.snakeHead : p.snakeBody);
    ctx.fillRect(ox + 1, oy + 1, CELL - 2, CELL - 2);

    ctx.fillStyle = flash ? '#d8d8d8' : p.snakeDark;
    ctx.fillRect(ox + 1, oy + CELL - 3, CELL - 2, 2);
    ctx.fillRect(ox + CELL - 3, oy + 1, 2, CELL - 2);

    ctx.fillStyle = flash ? '#ffffff' : p.snakeLight;
    ctx.fillRect(ox + 3, oy + 3, 4, 2);
    ctx.fillRect(ox + 3, oy + 3, 2, 4);

    if (isHead) drawEyes(p, ox, oy, flash);
  }
}

function drawMouseEyes(p, h, flash) {
  const fx = Math.cos(angle), fy = Math.sin(angle);
  const px = -fy, py = fx;
  const eyes = [
    { x: h.x + fx * 2.5 + px * 3.5, y: h.y + fy * 2.5 + py * 3.5 },
    { x: h.x + fx * 2.5 - px * 3.5, y: h.y + fy * 2.5 - py * 3.5 }
  ];
  for (const e of eyes) {
    const ex = Math.round(e.x), ey = Math.round(e.y);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ex - 1, ey - 1, 3, 3);
    if (!flash) {
      ctx.fillStyle = '#101020';
      ctx.fillRect(Math.round(ex + fx), Math.round(ey + fy), 1, 1);
    }
  }
}

function drawMouseSnake(p) {
  if (!body.length) return;
  const flash = state === 'dead' && performance.now() - deathAt < 170;

  ctx.fillStyle = flash ? '#ffffff' : p.snakeDark;
  for (let i = body.length - 1; i >= 1; i--) {
    ctx.fillRect(Math.round(body[i].x) - 5, Math.round(body[i].y) - 5, 10, 10);
  }

  ctx.fillStyle = flash ? '#ffffff' : p.snakeBody;
  for (let i = body.length - 1; i >= 1; i--) {
    ctx.fillRect(Math.round(body[i].x) - 4, Math.round(body[i].y) - 4, 8, 8);
  }

  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = flash ? '#ffffff' : p.snakeLight;
  for (let i = 3; i < body.length; i += 3) {
    ctx.fillRect(Math.round(body[i].x) - 3, Math.round(body[i].y) - 3, 2, 2);
  }
  ctx.restore();

  const h = body[0];
  const hx = Math.round(h.x), hy = Math.round(h.y);
  ctx.fillStyle = flash ? '#ffffff' : p.snakeDark;
  ctx.fillRect(hx - 6, hy - 6, 12, 12);
  ctx.fillStyle = flash ? '#ffffff' : p.snakeHead;
  ctx.fillRect(hx - 5, hy - 5, 10, 10);
  drawMouseEyes(p, h, flash);
}

function drawReticle(p) {
  if (!pointerInside) return;
  const x = Math.round(targetX), y = Math.round(targetY);
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = p.spark;
  ctx.fillRect(x - 5, y - 1, 3, 2);
  ctx.fillRect(x + 2, y - 1, 3, 2);
  ctx.fillRect(x - 1, y - 5, 2, 3);
  ctx.fillRect(x - 1, y + 2, 2, 3);
  ctx.restore();
}

/* ------------------------------------------------------------------ *
 *  render
 * ------------------------------------------------------------------ */
function render(t) {
  const p = pal();
  ctx.save();

  if (shake > 0.2) {
    ctx.translate(
      Math.round((Math.random() - 0.5) * shake),
      Math.round((Math.random() - 0.5) * shake)
    );
  }

  ctx.fillStyle = p.board;
  ctx.fillRect(-16, -16, W + 32, H + 32);

  ctx.fillStyle = p.boardAlt;
  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }

  drawFood(p, t);
  if (mode === 'mouse') drawMouseSnake(p); else drawSnake(p, t);
  drawParticles();
  drawFloats();
  if (mode === 'mouse' && state === 'playing') drawReticle(p);

  ctx.restore();
}

/* ------------------------------------------------------------------ *
 *  input
 * ------------------------------------------------------------------ */
const KEY_DIRS = {
  ArrowUp: [0, -1], KeyW: [0, -1],
  ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0],
  ArrowRight: [1, 0], KeyD: [1, 0]
};
const DIR_MAP = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function tryTurn(x, y) {
  if (state !== 'playing' || mode !== 'grid') return;
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if (lastDir.x === -x && lastDir.y === -y) return;   // no 180° flip
  if (lastDir.x === x && lastDir.y === y) return;     // already going there
  if (queue.length < 2) queue.push({ x, y });         // buffer quick turns
  ensureAudio();
}

let toastTimer = 0;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
}

function updateTarget(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  targetX = clamp((clientX - r.left) / r.width * W, 0, W);
  targetY = clamp((clientY - r.top) / r.height * H, 0, H);
  pointerInside = true;
}

function toggleMode() {
  ensureAudio();
  const live = state === 'playing' || state === 'paused';
  if (mode === 'grid') {
    mode = 'mouse';
    if (live) buildBodyFromGrid();
  } else {
    mode = 'grid';
    if (live) buildGridFromMouse();
  }
  document.body.classList.toggle('mode-mouse', mode === 'mouse');
  btnMode.textContent = mode === 'mouse' ? 'MODE: MOUSE' : 'MODE: KEYS';
  hintEl.textContent = mode === 'mouse'
    ? 'MOVE MOUSE / DRAG TO STEER · WALLS WRAP · SPACE PAUSE'
    : 'ARROWS / WASD MOVE · WALLS WRAP · SPACE PAUSE';
  if (state === 'title') resetGame();
  toast(mode === 'mouse' ? 'MOUSE MODE' : 'KEY MODE');
  beep(mode === 'mouse' ? 720 : 500, 0.06, 'triangle', 0.05);
}

function toggleSound() {
  ensureAudio();
  muted = !muted;
  btnSound.textContent = muted ? 'SOUND OFF' : 'SOUND ON';
  btnSound.setAttribute('aria-pressed', String(muted));
  if (!muted) beep(660, 0.07, 'square', 0.05);
}

function toggleTheme() {
  theme = theme === 'nes' ? 'cga' : 'nes';
  document.documentElement.dataset.theme = theme;
  ensureAudio();
  beep(theme === 'cga' ? 880 : 560, 0.06, 'triangle', 0.05);
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    ensureAudio();
    if (state === 'title' || state === 'dead') startGame();
    else togglePause();
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (state === 'playing' || state === 'paused') { e.preventDefault(); togglePause(); }
    return;
  }
  if (e.code === 'KeyC') { toggleMode(); return; }
  if (e.code === 'KeyM') { toggleSound(); return; }
  if (e.code === 'KeyT') { toggleTheme(); return; }

  const d = KEY_DIRS[e.code];
  if (!d) return;
  e.preventDefault();
  if (state === 'title' || state === 'dead') { startGame(); return; }
  tryTurn(d[0], d[1]);
});

overlay.addEventListener('click', () => {
  ensureAudio();
  if (state === 'title' || state === 'dead') startGame();
  else if (state === 'paused') togglePause();
});

btnPause.addEventListener('click', () => { ensureAudio(); togglePause(); });
btnMode.addEventListener('click', toggleMode);
btnSound.addEventListener('click', toggleSound);
btnTheme.addEventListener('click', toggleTheme);

screenEl.addEventListener('pointermove', (e) => {
  if (mode === 'mouse') updateTarget(e.clientX, e.clientY);
});
screenEl.addEventListener('pointerdown', (e) => {
  if (mode === 'mouse') updateTarget(e.clientX, e.clientY);
});
screenEl.addEventListener('pointerleave', () => { pointerInside = false; });

document.querySelectorAll('.dbtn').forEach((btn) => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    const d = DIR_MAP[btn.dataset.dir];
    tryTurn(d[0], d[1]);
  });
});

/* swipe controls */
let swipe = null;

screenEl.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  swipe = { x: t.clientX, y: t.clientY, at: performance.now() };
}, { passive: true });

screenEl.addEventListener('touchend', (e) => {
  if (!swipe) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x;
  const dy = t.clientY - swipe.y;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) > 22 && performance.now() - swipe.at < 800) {
    if (adx > ady) tryTurn(dx > 0 ? 1 : -1, 0);
    else tryTurn(0, dy > 0 ? 1 : -1);
  }
  swipe = null;
}, { passive: true });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') togglePause();
});

/* ------------------------------------------------------------------ *
 *  main loop
 * ------------------------------------------------------------------ */
function frame(now) {
  const dt = Math.min(100, now - last || 0);
  last = now;

  if (state === 'playing') {
    if (mode === 'grid') {
      acc += dt;
      let guard = 0;
      while (acc >= tickMs && guard++ < 5) {
        acc -= tickMs;
        step();
        if (state !== 'playing') break;
      }
    } else {
      updateMouse(dt);
    }

    if (state === 'playing' && food && food.type === 'golden' && performance.now() - food.born > 8000) {
      burst(food.x * CELL + 8, food.y * CELL + 8, pal().gold, 8, 0.8);
      food = spawnFood('apple');
    }
  }

  updateParticles(dt);
  updateFloats(dt);
  shake = Math.max(0, shake - dt * 0.02);

  render(now);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ *
 *  boot
 * ------------------------------------------------------------------ */
resetGame();
setOverlay('title');
last = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
